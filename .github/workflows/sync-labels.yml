name: Sync Labels

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - copilot/**
    paths:
      - ".github/labels.yml"
      - ".github/workflows/sync-labels.yml"

permissions:
  issues: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync labels from file
        uses: crazy-max/ghaction-github-labeler@v5
        with:
          yaml-file: .github/labels.yml
