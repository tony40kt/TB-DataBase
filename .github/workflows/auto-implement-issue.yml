name: Auto Implement Issue

on:
  issues:
    types: [opened, reopened, labeled, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: auto-implement-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  auto-implement:
    if: ${{ github.event.issue.pull_request == null }}
    runs-on: ubuntu-latest
    steps:
      - name: Create and assign implementation PR from labeled issue
        uses: actions/github-script@v7
        env:
          COPILOT_ASSIGNEES: ${{ vars.COPILOT_ASSIGNEES }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;

            if (!issue || issue.state !== "open") {
              core.info("Skip: issue is missing or not open.");
              return;
            }

            const labelNames = new Set((issue.labels || []).map((l) => l.name));
            if (!labelNames.has("auto:implement")) {
              core.info("Skip: issue does not have label auto:implement.");
              return;
            }

            const issueNumber = issue.number;
            const safeTitle = (issue.title || "Untitled issue").trim();
            const branch = `auto/issue-${issueNumber}-implement`;
            const issueRefRegex = new RegExp(`\\b#${issueNumber}\\b`);

            const hasIssueRef = (text) => issueRefRegex.test(text || "");
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100
            });
            let targetPr = openPulls.find((pr) => pr.head?.ref === branch || hasIssueRef(pr.body));

            const repoInfo = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoInfo.data.default_branch;

            if (!targetPr) {
              try {
                await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`
                });
                core.info(`Branch already exists: ${branch}`);
              } catch (error) {
                if (error.status !== 404) throw error;
                const baseRef = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${defaultBranch}`
                });
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/heads/${branch}`,
                  sha: baseRef.data.object.sha
                });
                core.info(`Created branch: ${branch}`);
              }

              const taskPath = `.github/auto-implement/issue-${issueNumber}.md`;
              try {
                await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: taskPath,
                  ref: branch
                });
                core.info(`Task file exists: ${taskPath}`);
              } catch (error) {
                if (error.status !== 404) throw error;
                const taskContent = [
                  `# Auto implement task for #${issueNumber}`,
                  "",
                  `Source issue: #${issueNumber}`,
                  "",
                  "## Issue title",
                  safeTitle,
                  "",
                  "## Issue body",
                  issue.body || "(empty)"
                ].join("\n");
                await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path: taskPath,
                  branch,
                  message: `chore(auto): bootstrap implementation task for #${issueNumber}`,
                  content: Buffer.from(taskContent, "utf8").toString("base64")
                });
                core.info(`Created task file: ${taskPath}`);
              }

              const prBody = [
                `Auto-generated from issue #${issueNumber}.`,
                "",
                `Closes #${issueNumber}`,
                "",
                "## Copilot task",
                "- Please implement requested changes based on the linked issue.",
                "- Update tests/docs if relevant."
              ].join("\n");

              try {
                const createdPr = await github.rest.pulls.create({
                  owner,
                  repo,
                  title: `[auto:implement] #${issueNumber} ${safeTitle}`,
                  head: branch,
                  base: defaultBranch,
                  body: prBody,
                  draft: true,
                  maintainer_can_modify: true
                });
                targetPr = createdPr.data;
                core.info(`Created PR #${targetPr.number}`);
              } catch (error) {
                if (error.status !== 422) throw error;
                const reloadedPulls = await github.paginate(github.rest.pulls.list, {
                  owner,
                  repo,
                  state: "open",
                  per_page: 100
                });
                targetPr = reloadedPulls.find((pr) => pr.head?.ref === branch || hasIssueRef(pr.body));
                if (!targetPr) throw error;
                core.info(`Reused existing PR #${targetPr.number}`);
              }
            } else {
              core.info(`Found existing PR #${targetPr.number}`);
            }

            const assignees = (process.env.COPILOT_ASSIGNEES || "copilot")
              .split(",")
              .map((name) => name.trim())
              .filter(Boolean);

            try {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: targetPr.number,
                assignees
              });
              core.info(`Assigned PR #${targetPr.number} to: ${assignees.join(", ")}`);
            } catch (error) {
              core.warning(`Unable to assign PR #${targetPr.number} to configured assignees: ${error.message}`);
            }

            const prCommentMarker = "<!-- auto-implement-copilot-task -->";
            const prComments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: targetPr.number,
              per_page: 100
            });
            const hasCopilotTaskComment = prComments.some((c) => (c.body || "").includes(prCommentMarker));
            if (!hasCopilotTaskComment) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: targetPr.number,
                body: [
                  prCommentMarker,
                  "Copilot agent task:",
                  `- Source issue: #${issueNumber}`,
                  "- Please implement the issue requirements and update this PR."
                ].join("\n")
              });
            }

            if (labelNames.has("status:todo")) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: "status:todo"
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            if (!labelNames.has("status:in-progress")) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ["status:in-progress"]
              });
            }

            const issueComments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100
            });
            const marker = "<!-- auto-implement-linked-pr -->";
            const alreadyCommented = issueComments.some((c) => (c.body || "").includes(marker));
            if (!alreadyCommented) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: [
                  marker,
                  `已自動建立並連結 PR: #${targetPr.number}`,
                  "Issue status 已更新為 `status:in-progress`。"
                ].join("\n")
              });
            }
