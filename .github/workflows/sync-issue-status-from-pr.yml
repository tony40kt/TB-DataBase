name: Sync Issue Status From PR

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: sync-issue-status-from-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-status:
    if: ${{ github.event.pull_request.state == 'open' }}
    runs-on: ubuntu-latest
    steps:
      - name: Move linked issues from todo to in-progress
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const text = [pr.title || "", pr.body || ""].join("\n");

            const closeRegex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*#(\d+)\b/gi;
            const issueNumbers = new Set();
            for (const match of text.matchAll(closeRegex)) {
              issueNumbers.add(Number(match[1]));
            }

            if (issueNumbers.size === 0) {
              core.info("No linked issue detected in PR title/body.");
              return;
            }

            for (const issueNumber of issueNumbers) {
              const issueResp = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });
              const issue = issueResp.data;
              if (issue.pull_request) {
                core.info(`Skip #${issueNumber}: reference points to a pull request, not an issue.`);
                continue;
              }
              if (issue.state !== "open") {
                core.info(`Skip #${issueNumber}: issue is not open.`);
                continue;
              }

              const labelNames = new Set((issue.labels || []).map((l) => l.name));
              if (labelNames.has("status:todo")) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    name: "status:todo"
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }

              if (!labelNames.has("status:in-progress")) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: ["status:in-progress"]
                });
              }

              core.info(`Updated issue #${issueNumber} => status:in-progress`);
            }
