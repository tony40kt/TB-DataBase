name: Auto Copilot Issue PR

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Only process one issue number (optional)"
        required: false
        type: string
  schedule:
    - cron: "0 */6 * * *"
  issues:
    types: [opened, reopened]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  request-copilot-pr:
    runs-on: ubuntu-latest
    env:
      COPILOT_ASSIGNEE: ${{ vars.COPILOT_ASSIGNEE || 'copilot-swe-agent' }}
    steps:
      - name: Ask Copilot to create PRs for issues
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = "<!-- copilot-auto-pr-request -->";
            const copilotAssignee = process.env.COPILOT_ASSIGNEE;

            async function getOpenIssues() {
              return github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: "open",
                per_page: 100
              });
            }

            async function hasLinkedPr(issueNumber) {
              const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100
              });

              const hasTimelineLink = timeline.some(
                (event) => event.event === "cross-referenced" && event.source?.issue?.pull_request
              );
              if (hasTimelineLink) return true;

              const pullRequests = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "open",
                per_page: 100
              });
              const closingKeyword = new RegExp(`\\b(close[sd]?|fix(es|ed)?|resolve[sd]?)\\s*#${issueNumber}\\b`, "i");
              return pullRequests.some((pr) => {
                const text = `${pr.title || ""}\n${pr.body || ""}`;
                return closingKeyword.test(text);
              });
            }

            async function hasRequestComment(issueNumber) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100
              });

              return comments.some((comment) => (comment.body || "").includes(marker));
            }

            async function processIssue(issue) {
              if (issue.pull_request || issue.state !== "open") return "skipped";

              const issueNumber = issue.number;
              const linkedPr = await hasLinkedPr(issueNumber);
              if (linkedPr) {
                core.info(`#${issueNumber}: linked PR already exists, skip.`);
                return "already_linked";
              }

              const assignees = (issue.assignees || []).map((a) => a.login);
              if (!assignees.includes(copilotAssignee)) {
                try {
                  await github.rest.issues.addAssignees({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    assignees: [copilotAssignee]
                  });
                  core.info(`#${issueNumber}: assigned to ${copilotAssignee}.`);
                } catch (error) {
                  core.warning(`#${issueNumber}: failed to assign ${copilotAssignee}. ${error.message}`);
                }
              }

              const alreadyCommented = await hasRequestComment(issueNumber);
              if (!alreadyCommented) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: [
                    marker,
                    "Please @copilot create a PR for this issue and generate all required files and code.",
                    "請 @copilot 根據此 issue 建立一個對應 PR，並補齊完成需求所需的檔案與程式碼。",
                    "",
                    "Requirements / 要求：",
                    "- Implement with the smallest complete change set / 以最小可行且完整的變更實作",
                    `- Link this issue in the PR (e.g. Closes #${issueNumber}) / PR 內容須關聯此 issue（例如 Closes #${issueNumber}）`,
                    "- Include tests or documentation updates when applicable / 包含必要測試或文件更新（若適用）"
                  ].join("\n")
                });
                core.info(`#${issueNumber}: copilot request comment created.`);
              } else {
                core.info(`#${issueNumber}: copilot request comment already exists.`);
              }

              return "requested";
            }

            let targets = [];
            const rawDispatchIssueInput = context.payload.inputs?.issue_number;
            const dispatchIssueInput = typeof rawDispatchIssueInput === "string" ? rawDispatchIssueInput.trim() : undefined;
            if (context.eventName === "issues") {
              targets = [context.payload.issue];
            } else if (context.eventName === "workflow_dispatch" && dispatchIssueInput) {
              const issueNumber = Number(dispatchIssueInput);
              if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
                core.setFailed("issue_number must be a positive integer.");
                return;
              }
              const { data } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });
              targets = [data];
            } else {
              const allOpenIssues = await getOpenIssues();
              targets = allOpenIssues.filter((item) => !item.pull_request);
            }

            let requested = 0;
            let alreadyLinked = 0;
            let skipped = 0;

            for (const issue of targets) {
              const result = await processIssue(issue);
              switch (result) {
                case "requested":
                  requested += 1;
                  break;
                case "already_linked":
                  alreadyLinked += 1;
                  break;
                default:
                  skipped += 1;
                  break;
              }
            }

            core.summary
              .addHeading("Auto Copilot Issue PR Result")
              .addTable([
                [{ data: "Processed", header: true }, String(targets.length)],
                [{ data: "Requested", header: true }, String(requested)],
                [{ data: "Already linked PR", header: true }, String(alreadyLinked)],
                [{ data: "Skipped", header: true }, String(skipped)]
              ])
              .write();
